name: CI

on:
  push:
    branches: [v2]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      # The admin flow against the same build: JSON-file store, local media,
      # test sign-in (playwright.admin.config.ts). Before the fixture build.
      - run: npm run e2e:admin
      # Second pass: a build in fixture data mode, so /life renders real rows.
      # The normal e2e above must keep running against the non-fixture build.
      - run: SOURCE_FIXTURES=1 npm run build
      - run: npm run e2e:fixtures
      # Traces of failed tests (retried once in CI, traced on the retry). A
      # failure before e2e (typecheck, lint) leaves no test-results/.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: |
            test-results/
            .e2e-admin/content.json
          retention-days: 7
          if-no-files-found: ignore
